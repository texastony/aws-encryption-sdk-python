AWSTemplateFormatVersion: "2010-09-09"
# SCRATCH, for review; to be removed with the scratch test that uses it.
#
# Two tenant roles for the multi-tenant Hierarchical Keyring example. Deploy with:
#
#   aws cloudformation deploy --region us-east-1 \
#     --template-file examples/test/multi_tenant/scratch_kms_tenant_roles.yaml \
#     --stack-name esdk-python-multi-tenant-scratch --capabilities CAPABILITY_NAMED_IAM \
#     --parameter-overrides TenantPrincipalArn=<ARN of the IAM user or role that runs the test>
#
# Each tenant role allows the KMS data plane actions on one KMS key (by default, the AWS Encryption SDK's
# public test key), but only for requests whose encryption context has aws-crypto-ec:tenant set to that tenant:
# the AWS KMS Key Store sends a Branch Key's custom encryption context to AWS KMS prefixed with "aws-crypto-ec:",
# and the example creates each tenant's Branch Key with {"tenant": <tenant>}.
# So AWS KMS itself Denies one tenant's role another tenant's Branch Key.
#
# Both roles trust only TenantPrincipalArn, by ARN; within one account, that alone lets it assume them.
# A cross-account key also needs its own key policy to allow each action: the public test key's
# refuses kms:GenerateDataKeyWithoutPlaintext and kms:ReEncrypt* to other accounts, so these roles cannot create
# a Branch Key through the AWS KMS Key Store.
Description: >
  SCRATCH: two tenant roles for the AWS Encryption SDK for Python's multi-tenant Hierarchical Keyring example,
  each allowed the KMS data plane actions on one KMS key only for its own tenant's encryption context.

Parameters:
  TenantPrincipalArn:
    Type: String
    Description: ARN of the IAM user or role, in this account, allowed to assume the tenant roles.

  KmsKeyArn:
    Type: String
    Default: arn:aws:kms:us-west-2:658956600833:key/b3537ef1-d8dc-4780-9f5a-55776cbb2f7f
    Description: >
      ARN of the KMS key the tenant roles may use. Defaults to the AWS Encryption SDK's public test key,
      whose key policy allows kms:Encrypt, kms:Decrypt, and kms:GenerateDataKey from any AWS principal.

Resources:
  TenantARole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: esdk-python-scratch-tenant-a
      Description: >-
        SCRATCH: the KMS data plane actions on one KMS key, only when the encryption context has
        aws-crypto-ec:tenant = tenant-a.
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Ref TenantPrincipalArn
            Action: sts:AssumeRole
      Policies:
        - PolicyName: tenant-a-encryption-context-only
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: TenantAEncryptionContextOnly
                Effect: Allow
                Action:
                  - kms:Encrypt
                  - kms:Decrypt
                  - kms:ReEncryptFrom
                  - kms:ReEncryptTo
                  - kms:GenerateDataKey
                  - kms:GenerateDataKeyWithoutPlaintext
                  - kms:GenerateDataKeyPair
                  - kms:GenerateDataKeyPairWithoutPlaintext
                Resource: !Ref KmsKeyArn
                Condition:
                  StringEquals:
                    "kms:EncryptionContext:aws-crypto-ec:tenant": "tenant-a"

  TenantBRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: esdk-python-scratch-tenant-b
      Description: >-
        SCRATCH: the KMS data plane actions on one KMS key, only when the encryption context has
        aws-crypto-ec:tenant = tenant-b.
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Ref TenantPrincipalArn
            Action: sts:AssumeRole
      Policies:
        - PolicyName: tenant-b-encryption-context-only
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: TenantBEncryptionContextOnly
                Effect: Allow
                Action:
                  - kms:Encrypt
                  - kms:Decrypt
                  - kms:ReEncryptFrom
                  - kms:ReEncryptTo
                  - kms:GenerateDataKey
                  - kms:GenerateDataKeyWithoutPlaintext
                  - kms:GenerateDataKeyPair
                  - kms:GenerateDataKeyPairWithoutPlaintext
                Resource: !Ref KmsKeyArn
                Condition:
                  StringEquals:
                    "kms:EncryptionContext:aws-crypto-ec:tenant": "tenant-b"

Outputs:
  TenantARoleArn:
    Description: Assumed for tenant-a; its KMS requests MUST have aws-crypto-ec:tenant = tenant-a.
    Value: !GetAtt TenantARole.Arn
  TenantBRoleArn:
    Description: Assumed for tenant-b; its KMS requests MUST have aws-crypto-ec:tenant = tenant-b.
    Value: !GetAtt TenantBRole.Arn
  KmsKeyArn:
    Description: The KMS key the tenant roles may use.
    Value: !Ref KmsKeyArn
