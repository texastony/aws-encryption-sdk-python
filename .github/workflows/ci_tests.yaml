name: Continuous Integration tests

on:
  workflow_call:

env:
  AWS_ENCRYPTION_SDK_PYTHON_INTEGRATION_TEST_AWS_KMS_KEY_ID: |
    arn:aws:kms:us-west-2:658956600833:key/b3537ef1-d8dc-4780-9f5a-55776cbb2f7f
  AWS_ENCRYPTION_SDK_PYTHON_INTEGRATION_TEST_AWS_KMS_KEY_ID_2: |
    arn:aws:kms:eu-central-1:658956600833:key/75414c93-5285-4b57-99c9-30c1cf0a22c2
  AWS_ENCRYPTION_SDK_PYTHON_INTEGRATION_TEST_AWS_KMS_MRK_KEY_ID_1: |
    arn:aws:kms:us-west-2:658956600833:key/mrk-80bd8ecdcd4342aebd84b7dc9da498a7
  AWS_ENCRYPTION_SDK_PYTHON_INTEGRATION_TEST_AWS_KMS_MRK_KEY_ID_2: |
    arn:aws:kms:us-east-1:658956600833:key/mrk-80bd8ecdcd4342aebd84b7dc9da498a7

permissions:
  contents: read

jobs:
  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      # To keep CI cheap, only Python 3.12 on Ubuntu is tested.
      # Python 3.8, 3.9, and 3.10 are end of life;
      # the ubuntu-latest runner no longer provides 3.8 or 3.9.
      matrix:
        os:
          - ubuntu-latest
        python:
          - "3.12"
        architecture:
          - x64
        category:
          - local
          - accept
          - mpllocal
# These require credentials.
# Enable them once we sort how to provide them.
#          - integ
#          - examples
        # Append '-mpl' to some test environments.
        # This suffix signals to tox to install the MPL in the test environment. 
        optional_mpl_dependency:
          - ""
          - -mpl
        exclude:
          # mpllocal requires the MPL to be installed
          - category: mpllocal
            optional_mpl_dependency: ""
    steps:
      # Support long Dafny filenames (used in MPL and DBESDK repos)
      - name: Support longpaths
        run: |
          git config --global core.longpaths true

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python }}
          architecture: ${{ matrix.architecture }}
      - run: |
          python -m pip install --upgrade pip
          pip install --upgrade -r dev_requirements/ci-requirements.txt
      - name: run test
        env:
          TOXENV: ${{ matrix.category }}${{ matrix.optional_mpl_dependency }}
        run: tox -- -vv
  nocmk:
    # Python 3.12 only, as above. test-upstream-requirements-py311 is not run:
    # it pins Python 3.11 and frozen 3.11 requirements, with no 3.12 equivalent.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        category:
          - nocmk
    steps:
        - uses: actions/checkout@v4
        - uses: actions/setup-python@v4
          with:
            python-version: "3.12"
        - run: |
            python -m pip install --upgrade pip
            pip install --upgrade -r dev_requirements/ci-requirements.txt
        - name: run test
          env:
            TOXENV: ${{ matrix.category }}
          run: tox -- -vv
